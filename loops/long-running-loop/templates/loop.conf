# loop.conf: settings for loop.sh (shell assignments). The environment overrides them,
# for example `env MAX_ROUNDS=5 loop.sh run`. `loop.sh config` prints the effective values.
# Every line here is optional: the values shown are the defaults.

# --- Where
# WORKDIR=""                 # the git work tree the rounds work in (default: the one holding this loop)
# NAME=""                    # shown in views and notifications (default: WORKDIR's name)
# STATE_DIR=""               # logs, lock, stop file (default: <loop>/state, git-ignored)
# SCRATCH=""                 # temp files and build dirs for rounds (default: <state>/scratch);
#                            # put it on a big disk for heavy builds
# ADD_DIRS=""                # extra directories the rounds may read/write (space-separated)

# --- The sessions
# CLAUDE_BIN=claude
# MODEL=claude-opus-5-5
# EFFORT=high                # low | medium | high | xhigh | max
# SUBAGENT_MODEL=sonnet      # exported as CLAUDE_CODE_SUBAGENT_MODEL
# PERMISSION_MODE=auto       # rounds are unattended: auto, or a mode with an allow list
# MAX_TURNS=500              # per round, 0 = no cap
# EXTRA_ARGS=""              # more claude CLI arguments
# EXPORT_ENV=""              # VAR=value pairs exported to every round, e.g. "CARGO_BUILD_JOBS=4"
# GIT_NAME=""                # commit author and committer for the rounds' commits
# GIT_EMAIL=""
# BASH_DEFAULT_TIMEOUT_MS=3600000   # long builds and test runs
# BASH_MAX_TIMEOUT_MS=7200000

# --- When to stop
# MAX_ROUNDS=30              # per run of the loop
# STALL_ROUNDS=2             # rounds in a row without a commit
# MAX_FAILURES=3             # failed sessions in a row
# MAX_COST=""                # dollars, as the CLI reports them (unset: no limit)

# --- Waiting instead of failing
# LIMIT_WAIT=1800            # usage limit without a reset time, seconds
# CLASSIFIER_WAIT=600        # auto mode's safety check unavailable
# TRANSIENT_WAIT=300         # API overloaded / 5xx before any work

# --- Comfort
# NOTIFY=1                   # macOS notifications
# KEEP_AWAKE=1               # caffeinate while the loop runs (macOS)

# --- Views
# TMUX_SESSION=""            # default: loop-<NAME>
# FOLLOW_LINES=10            # round events under the log in `follow` (0: log only)
# FOLLOW_WIDTH=2             # line length in screen widths (0: whole lines)
# WATCH_LINES=40             # history shown when `watch` starts
# WATCH_THINKING=1           # show thinking in `watch`
# COMMIT_ROUNDS=3            # rounds shown by the tmux commits pane
# COMMIT_COUNT=40            # commits per round in `commits`
# EVERY=2                    # refresh period of the views, seconds
