<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">skills: loops as orbits around a planet</title>
  <defs>
    <radialGradient id="space" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1023"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#9a3412"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <circle cx="128" cy="128" r="124" fill="url(#space)"/>
  <circle cx="128" cy="128" r="123" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="2"/>

  <g fill="#e0e7ff">
    <circle cx="58" cy="52" r="1.6"/>
    <circle cx="196" cy="44" r="1.2"/>
    <circle cx="214" cy="92" r="1.8"/>
    <circle cx="40" cy="170" r="1.3"/>
    <circle cx="88" cy="214" r="1.5"/>
    <circle cx="190" cy="206" r="1.2"/>
    <circle cx="150" cy="30" r="1"/>
    <circle cx="30" cy="110" r="1"/>
  </g>

  <!-- inner orbit, tilted the other way -->
  <g transform="rotate(28 128 128)">
    <ellipse cx="128" cy="128" rx="74" ry="26" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.85"/>
    <circle cx="163" cy="105.5" r="5.5" fill="#ddd6fe"/>
  </g>

  <!-- outer orbit, back half (drawn behind the planet) -->
  <g transform="rotate(-18 128 128)">
    <path d="M30.27 114.32 A104 40 0 1 1 30.27 141.68" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <circle cx="128" cy="128" r="54" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="36" fill="url(#planet)"/>
  <path d="M98 120 Q128 112 158 122" fill="none" stroke="#fef3c7" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  <path d="M96 138 Q128 146 160 136" fill="none" stroke="#7c2d12" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- inner orbit, front half -->
  <g transform="rotate(28 128 128)">
    <path d="M202 128 A74 26 0 0 1 54 128" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.85"/>
  </g>

  <!-- outer orbit, front half with the arrow that makes it a loop -->
  <g transform="rotate(-18 128 128)">
    <path d="M232 128 A104 40 0 0 1 30.27 141.68" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="180" cy="162.6" r="8" fill="#e0f2fe"/>
    <circle cx="177.5" cy="160" r="3" fill="#ffffff" fill-opacity="0.8"/>
  </g>
</svg>
